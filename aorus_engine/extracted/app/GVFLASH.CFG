; Build Date: 2006/3/14
; 09/25/06  RV560/RV570 supported
; 06/13/06  add NV G72 AND RV516
; 03/14/06  add NV G73 and G71 supported
; 11/01/05  add ATi X1800,X1600,X1300 flash function supported
; 11/19/04  add HClk_Overide_Flag to ASIC_NV for NV43 fix can't flash bug
; 09/23/04  add T510PCI/E RV410
; 07/05/04  Modify R423 WR_EN/DIS ROM_EN/DIS Register
; ASIC definition
;
; 01/28/00  use ID 041F for AT49F511
; 03/01/00  disable GPIO for Rage128/+/pro
; 05/01/00  disable VIP for Rage6
; 05/30/00  use ID 041F for AT49F001 (128 Kbytes)
; 06/01/00  add support for Rage128 Pro 2
; 06/09/00  add support more SST flash
; 06/21/00  modify INIT_REG definition for Rage128 Pro 2
; 06/23/00  use ID 041F for AT49F511 and let flashrom.exe adjusts the rom
;           size if -pm is used
; 08/30/00  lower rage6 rom clk
; 09/06/00  add support for M6
; 10/04/00  lower rom clk and disable CRT for r128pro
; 03/26/01  add support for RageLTPro
; 05/10/01  add support for R200/Rage6X (Chaplin) & RV200
;           add new serial rom types: AT45DB011, AT25F1024, M25P05, M25P10,
;              & NX25F011B (for reference)
; 08/10/01  added new chipIDs for R200 AIW w/ Bridget
; 09/04/01  added support for PMC ROM chips
; 11/29/01  lower RV200/M7 serial clk
;           changed chipid '4240' to '4242' specific for R200 AIWw/Bridget to
;              skip detection of bridget chip as a graphics adapter
; 12/13/01  disabled FP2 DVO for R200
; 12/14/01  added support for AMIC parallel ROM (AmicA29001 & AmicA290011)
; 03/06/02  use bus clk for R200 serial rom
; 03/21/02  added support for R300/RV300/RL300(Khan), RV250(Iris), & M9(Iris)
; 05/23/02  to reduce noise on R200 boards:
;              turn off display memory request and disable display controller
;              set sclk to bus clk
;              enable all dynamic clocking in SCLK_CNTL
;              enable all dynamic clocking in MCLK_CNTL
;              stop ppll
; 06/20/02  changed R300 chip ID to 0x4E4X
; 07/09/02  added R300 chip ID 0x414X
; 07/31/02  increased sck prescale for R300
; 11/27/02  added support for R350 and RV350
; 12/05/02  disabled external TMDS on RV100/M6
; 12/17/02  added support for M29W010B
; 03/13/03  removed changes in dynamic clocking for rage6/r6x
; 06/24/03  turned off display and switched to pci clk for R300/R350
; 02/11/04  switch to pci clk for RV350/M10
; 02/18/04  added R423 chip IDs 0x5D4X 0x554X
; 02/23/04  switch to pci clk for RV370/RV380/R420/R423
; 03/10/04  added R423 chip IDs 0x5D5X 0x555X
; 03/26/04  merged 2 entries of R423 chip IDs

